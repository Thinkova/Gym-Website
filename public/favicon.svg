<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#11161a"/>
  <!-- Border frame -->
  <rect x="3" y="3" width="58" height="58" stroke="#d94f30" stroke-width="2.5"/>
  <!-- Dumbbell shape -->
  <!-- Left weight block -->
  <rect x="6" y="26" width="10" height="12" rx="1.5" fill="#d94f30"/>
  <!-- Left bar handle -->
  <rect x="16" y="29" width="8" height="6" rx="1" fill="#eff1f2"/>
  <!-- Center bar -->
  <rect x="24" y="30" width="16" height="4" rx="1" fill="#eff1f2"/>
  <!-- Right bar handle -->
  <rect x="40" y="29" width="8" height="6" rx="1" fill="#eff1f2"/>
  <!-- Right weight block -->
  <rect x="48" y="26" width="10" height="12" rx="1.5" fill="#d94f30"/>
  <!-- Corner marks (signature) -->
  <polyline points="3,3 11,3" stroke="#d94f30" stroke-width="2"/>
  <polyline points="3,3 3,11" stroke="#d94f30" stroke-width="2"/>
  <polyline points="61,3 53,3" stroke="#d94f30" stroke-width="2"/>
  <polyline points="61,3 61,11" stroke="#d94f30" stroke-width="2"/>
  <polyline points="3,61 11,61" stroke="#d94f30" stroke-width="2"/>
  <polyline points="3,61 3,53" stroke="#d94f30" stroke-width="2"/>
  <polyline points="61,61 53,61" stroke="#d94f30" stroke-width="2"/>
  <polyline points="61,61 61,53" stroke="#d94f30" stroke-width="2"/>
</svg>
